<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="bubble.css">
    <title>BUBBLE GAME</title>

    <!-- FOLLOWED THIS YOUTUBE VIDEO : https://www.youtube.com/watch?v=Y1tsJD28ocU&t=3404s -->
</head>
<body>
    <div id="main">
        <audio src="click_audio_sound.mp3" id="correct_click_sound" preload="auto"></audio>
        <audio src="game_over_sound.mp3" id="game_over_sound" preload="auto"></audio>
        <audio src="wrong_click_effect.mp3" id="wrong_click_sound" preload="auto"></audio>

        <div id="panel">
            <div id="top_panel">

                <div class="elem">
                <h4>HIGH SCORE</h4>
                <div id="highscorebox" class="box">0</div>
                </div>

                <div class="elem">
                    <h4>HIT</h4>
                    <div id="hitbox" class="box">6</div>
                </div>
                <div class="elem">
                    <h4>TIMER</h4>
                    <div id="timer_box" class="box">60</div>
                </div>
                <div class="elem">
                    <h4>SCORE</h4>
                    <div id="scorebox" class="box">0</div>
                </div>
                <div id="start_btn">START</div>

            </div>

            <div id="panel_bottom">
                <div class="bubble">5</div>
                
            </div>
        </div>
    </div>
</body>
    <script src="bubble.js"></script>
</html>
