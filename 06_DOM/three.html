<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style = "background-color: black; color: white;">
    
</body>

    <script>

        let arr = ["red","blue","green","yellow","orange"];
        function createDiv(bgc) {
            const div = document.createElement('div');
            console.log(div);
            div.className = "box";
            div.id = Math.round(Math.random() * 10) ;

            div.setAttribute('.class', 'this-is-a-class');
            
            div.style.backgroundColor = bgc;
            div.style.padding = "20px";
            div.style.borderRadius = "20px";
            div.innerText = "This is a div element created by JS";

            const text = document.createTextNode("This is a text node created by JS");
            div.appendChild(text); 

            document.body.appendChild(div);
        }
        
        for (let i = 0; i < arr.length*3; i++) {
            createDiv(arr[i%arr.length]);
        }

    </script>
</html>
