<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Chai aur code</h1>
    <button id="stop">Stop</button>
</body>
    <script>

        const change = function(){
            document.querySelector('h1').innerHTML = 'Hora is Gora'
        }
        let clear = setTimeout(change,2000)


        // const sayHora = function(){
        //     console.log("Hora")
        // }
        // setTimeout(sayHora,3000)

        document.querySelector('#stop').addEventListener('click',function(){
            document.querySelector('h1').innerHTML = 'Chai aur code'
            clearTimeout(clear);
        })
    </script>
</html>
